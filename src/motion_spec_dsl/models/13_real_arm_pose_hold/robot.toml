# Where each device is reached. Keyed by the name the execution context binds.
#
# Three devices bound separately, so each opens its own connection: the arm over the network,
# the gripper and the force-torque sensor over serial.

[agents.arm1]
ip                    = "192.168.1.10"
user                  = "admin"
password              = "admin"
port                  = 10000
port_real_time        = 10001
session_timeout_ms    = 60000
connection_timeout_ms = 2000

[agents.gripper1]
port          = "/dev/ttyUSB1"
baudrate      = 115200
slave_address = 0x09
gripper_force_pct = 100
gripper_speed_pct = 50

[arm1.wrist_ft]
port          = "/dev/ttyUSB0"
baudrate      = 19200
# A read waits this long for the next frame; the sensor streams one every 10 ms, and the USB
# converter's own latency timer adds up to 16 ms of it.
timeout_ms    = 50.0
# The driver reopens the port and restarts the stream by itself once a run of reads comes back
# empty, which costs it about a second; this is the window the loop gives that before it stops.
invalid_after_ms = 2000.0
slave_address = 0x09
bias_samples  = 100

# Publishing the driven joints is the deployment's call, not the model's: the section's presence
# turns it on, and retuning the topic or the rate needs no regeneration.
[ros.joint_states]
topic = "/joint_states"
rate  = 100.0
