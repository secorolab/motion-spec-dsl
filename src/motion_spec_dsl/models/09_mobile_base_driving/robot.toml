# What the platform's kinematic tree cannot state. Where the pivots stand, how far apart the
# axles are and how far each trails its pivot come from eddie_base.ktree through the IR.

[platform]
# Effective rolling diameter, per wheel. The tyres are 0.105 m across unloaded and sink about
# 0.15 mm into the contact under the platform's 94.8 kg, measured in simulation as distance
# travelled over hub angle at steady cruise.
wheel_diameter = [0.1047, 0.1047, 0.1047, 0.1047, 0.1047, 0.1047, 0.1047, 0.1047]

# Castor alignment, relative to the platform wrench. hddc2b scales the alignment reference by the
# magnitude of that wrench, so this sets the ratio between the two tasks rather than an absolute
# size. At 1.0 the castors hunt; at 0.05 they align at no measurable cost in tracking.
w_align = [0.05, 0.05, 0.05, 0.05, 0.05, 0.05, 0.05, 0.05]
