name: build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check src

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build

      - name: Verify the wheel imports (no runtime deps resolved)
        run: |
          pip install --no-deps dist/*.whl
          python -c "import motion_spec_dsl; print('import ok')"
