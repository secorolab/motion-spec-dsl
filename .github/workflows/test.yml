name: test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # This package is a workspace component. Its runtime siblings (rdf_utils,
      # motion_spec, coord_dsl) and a patched rdflib are not on PyPI, so they are
      # installed from git. The siblings under-declare their deps, so jinja2 (coord_dsl)
      # is added explicitly. Assumes the secorolab repos are public; add a token otherwise.
      - name: Install workspace siblings
        run: |
          pip install pytest textX pyshacl platformdirs textx_ls_core jinja2
          pip install \
            "git+https://github.com/secorolab/rdf-utils.git@main" \
            "git+https://github.com/secorolab/motion-spec.git@dev" \
            "git+https://github.com/secorolab/coord-dsl.git@main"

          # scene-dsl declares bdd-dsl, which is not available on PyPI.
          pip install --no-deps "git+https://github.com/secorolab/scene-dsl.git@main"

      - name: Install motion_spec_dsl
        run: pip install -e . --no-deps

      # The patched rdflib must win over the PyPI rdflib the siblings pulled in.
      - name: Pin patched rdflib
        run: |
          pip install --force-reinstall --no-deps \
            "git+https://github.com/secorolab/rdflib.git@7.6.0-fix-multi-type-scoped-context"

      - name: Run tests
        run: pytest -q
