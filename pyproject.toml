[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "motion_spec_dsl"
version = "0.1.0"
description = "A DSL for specifying guarded motions, transforming .rob_mot files to JSON-LD."
authors = [
    {name = "Sven Schneider", email = "sven.schneider@h-brs.de"},
    {name = "Vamsi Kalagaturu", email = "vamsikalagaturu@gmail.com"}
]
maintainers = [
    {name = "Vamsi Kalagaturu", email = "vamsikalagaturu@gmail.com"}
]
license = { text = "MPL-2.0" }
requires-python = ">=3.10"
dependencies = [
    "textX>=4.1.0",
    "rdflib>=7.6.0",
    "rdf-utils",
    "pyshacl>=0.25.0",
    "PyLD>=2.0.0",
    "coord_dsl",
    "scene-dsl",
]

[project.entry-points."textx_languages"]
"motion_spec" = "motion_spec_dsl.registration:motion_spec_lang"

[project.entry-points."textx_generators"]
"motion_spec_jsonld" = "motion_spec_dsl.registration:motion_spec_gen"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"motion_spec_dsl" = [
    "grammars/*.tx",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
filterwarnings = [
    "error::DeprecationWarning",
    # The patched rdflib fork (7.6.0-fix-multi-type-scoped-context) and pyshacl both
    # still reach through these deprecated rdflib APIs internally; drop each exact
    # upstream message once the fork/pyshacl no longer emit it.
    "ignore:ConjunctiveGraph is deprecated, use Dataset instead\\.:DeprecationWarning",
    "ignore:Dataset\\.contexts is deprecated, use Dataset\\.graphs instead\\.:DeprecationWarning",
    "ignore:Dataset\\.default_context is deprecated, use Dataset\\.default_graph instead\\.:DeprecationWarning",
    "ignore:Dataset\\.identifier is deprecated and will be removed in future versions\\.:DeprecationWarning",
]
