# Where each device is reached. Keyed by the name the execution context binds.
#
# One device is bound -- KinovaGen3-2F85 -- so there is one connection: the gripper rides the
# arm's interconnect and has no section of its own.

[agents.arm1]
ip                    = "192.168.1.10"
user                  = "admin"
password              = "admin"
port                  = 10000
port_real_time        = 10001
session_timeout_ms    = 60000
connection_timeout_ms = 2000

[arm1.wrist_ft]
port          = "ttyUSB0"
baudrate      = 19200
timeout_ms    = 1.0
slave_address = 0x09
bias_samples  = 100
