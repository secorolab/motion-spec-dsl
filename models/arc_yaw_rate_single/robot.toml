# Where each agent starts. Keyed by the name the execution context binds.

[agents.kinova_ft_2f85]
# Joint configuration the simulator resets to, in the chain's joint order [rad]. The arc's
# target pose is this configuration with joint 1 at +90 deg, so the two travel together.
home = [0.0, 0.2618, 3.1416, -2.2689, 0.0, 0.9599, 1.5708]

# Publishing the driven joints is the deployment's call, not the model's: the section's presence
# turns it on, and retuning the topic or the rate needs no regeneration.
[ros.joint_states]
topic = "/joint_states"
rate = 100.0
