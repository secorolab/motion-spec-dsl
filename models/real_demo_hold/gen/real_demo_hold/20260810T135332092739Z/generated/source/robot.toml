# Where each device is reached. Keyed by the name the execution context binds.
#
# Two devices, so two connections: the arm over the network and the force-torque sensor over
# serial. The gripper is bound by nothing here -- this model commands only the arm.

[agents.arm1]
ip                    = "192.168.1.10"
user                  = "admin"
password              = "admin"
port                  = 10000
port_real_time        = 10001
session_timeout_ms    = 60000
connection_timeout_ms = 2000

[arm1.wrist_ft]
port          = "ttyUSB0"
baudrate      = 19200
timeout_ms    = 1.0
slave_address = 0x09
bias_samples  = 100

# Publishing the driven joints is the deployment's call, not the model's: the section's presence
# turns it on, and retuning the topic or the rate needs no regeneration.
[ros.joint_states]
topic = "/joint_states"
rate  = 100.0
